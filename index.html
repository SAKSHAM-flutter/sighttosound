<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SightToSound - Pixelverse AI Visual Music Matcher</title>
  
  <!-- TensorFlow.js & COCO-SSD Object Detection Models -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

  <style>
    :root {
      --bg: #070a12;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.45);
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #0f172a;
      --radius-lg: 20px;
      --radius-md: 12px;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15), transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.12), transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(12px, 3vw, 24px);
    }

    /* Container System for Big & Small Screens */
    .app-container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: clamp(16px, 4vw, 32px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    header { 
      text-align: center; 
      margin-bottom: clamp(16px, 3vw, 28px); 
    }
    
    header h1 { 
      font-size: clamp(1.8rem, 5vw, 2.8rem); 
      font-weight: 800;
      letter-spacing: -0.8px;
      background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #38bdf8 100%); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
      line-height: 1.2;
    }
    
    header p { 
      color: var(--text-muted); 
      font-size: clamp(0.85rem, 2vw, 1rem); 
      margin-top: 6px; 
    }

    /* Control Panel Responsive Grid */
    .control-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: clamp(10px, 2vw, 16px);
      margin-bottom: clamp(16px, 3vw, 24px);
    }

    .input-group { 
      display: flex; 
      flex-direction: column; 
      gap: 6px; 
    }
    
    .input-group label { 
      font-size: 0.75rem; 
      font-weight: 700; 
      text-transform: uppercase; 
      letter-spacing: 0.8px; 
      color: #cbd5e1; 
    }
    
    select {
      background: var(--input-bg);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 14px;
      border-radius: var(--radius-md);
      outline: none;
      cursor: pointer;
      font-size: 0.95rem;
      min-height: 44px;
      width: 100%;
      transition: all 0.25s ease;
    }
    
    select:focus { 
      border-color: var(--accent); 
      box-shadow: 0 0 12px var(--accent-glow); 
    }

    /* Upload & Scanner Zone */
    .drop-zone {
      border: 2px dashed rgba(255, 255, 255, 0.18);
      border-radius: var(--radius-lg);
      padding: clamp(20px, 4vw, 36px);
      text-align: center;
      cursor: pointer;
      position: relative;
      background: rgba(15, 23, 42, 0.4);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    
    .drop-zone:hover, .drop-zone.dragover { 
      border-color: var(--accent); 
      background: rgba(99, 102, 241, 0.08); 
    }
    
    .drop-zone input { display: none; }

    .drop-zone p {
      font-size: clamp(0.9rem, 2.5vw, 1.05rem);
      color: #e2e8f0;
    }

    .media-preview-container {
      position: relative;
      width: 100%;
      max-width: 100%;
      margin-top: 10px;
      display: none;
      justify-content: center;
      align-items: center;
    }

    .media-preview-container img {
      max-width: 100%;
      max-height: clamp(200px, 40vh, 320px);
      object-fit: contain;
      border-radius: var(--radius-md);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .scanner-line {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(90deg, transparent, #38bdf8, #ec4899, transparent);
      box-shadow: 0 0 15px #38bdf8;
      display: none;
      animation: scan 2s infinite ease-in-out;
      z-index: 5;
    }
    
    @keyframes scan { 
      0% { top: 0%; } 
      50% { top: 96%; } 
      100% { top: 0%; } 
    }

    .status-badge {
      text-align: center;
      font-size: clamp(0.8rem, 2vw, 0.9rem);
      color: var(--text-muted);
      margin: 14px 0;
      min-height: 1.4em;
    }

    /* Custom Player Card & Adaptive Layout */
    .player-card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: clamp(14px, 3vw, 22px);
      margin-top: 14px;
      display: none;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .song-header {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 12px;
    }

    .song-details {
      flex: 1;
      min-width: 180px;
    }

    .song-title { 
      font-size: clamp(1.1rem, 3vw, 1.35rem); 
      font-weight: 700; 
      color: #38bdf8;
      line-height: 1.3;
    }
    
    .song-artist { 
      font-size: clamp(0.8rem, 2vw, 0.9rem); 
      color: var(--text-muted); 
      margin-top: 2px; 
    }

    /* Interactive Unique Button */
    .btn-remix {
      background: var(--accent-gradient);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: 700;
      font-size: clamp(0.85rem, 2.2vw, 0.95rem);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      box-shadow: 0 4px 18px rgba(236, 72, 153, 0.35);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: soft-pulse 3s infinite;
      white-space: nowrap;
    }
    
    .btn-remix:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 8px 25px rgba(236, 72, 153, 0.55);
    }
    
    .btn-remix:active { 
      transform: translateY(0) scale(0.98); 
    }

    @keyframes soft-pulse {
      0%, 100% { box-shadow: 0 4px 18px rgba(236, 72, 153, 0.35); }
      50% { box-shadow: 0 4px 28px rgba(99, 102, 241, 0.65); }
    }

    audio { 
      width: 100%; 
      height: 42px; 
      border-radius: 8px; 
      outline: none;
    }

    .lyrics-box {
      background: rgba(7, 10, 18, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md);
      padding: clamp(12px, 2.5vw, 16px);
      max-height: 140px;
      overflow-y: auto;
      font-size: clamp(0.85rem, 2.2vw, 0.95rem);
      line-height: 1.6;
      color: #cbd5e1;
      white-space: pre-line;
      text-align: center;
    }

    /* History Sequence Section */
    .history-card {
      background: rgba(7, 10, 18, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-lg);
      padding: clamp(14px, 3vw, 18px);
      margin-top: 14px;
      display: none;
    }

    .history-card h3 {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 160px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      gap: 10px;
    }

    .history-item.active {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.08);
    }

    .history-info {
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .history-info-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-index {
      font-weight: 800;
      color: var(--accent);
      margin-right: 10px;
      min-width: 22px;
    }

    .badge-lang {
      font-size: 0.7rem;
      color: #94a3b8;
      background: #020617;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      white-space: nowrap;
    }

    /* Custom Scrollbar Styling */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    /* Extra Mobile Adjustments */
    @media (max-width: 480px) {
      .song-header {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
      }

      .btn-remix {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>SightToSound</h1>
    <p>AI Visual Music Matcher</p>
  </header>

  <div class="control-panel">
    <div class="input-group">
      <label for="languageSelect">Music Language</label>
      <select id="languageSelect">
        <option value="hindi" selected>Hindi (हिंदी)</option>
        <option value="english">English</option>
        <option value="bengali">Bengali (বাংলা)</option>
        <option value="spanish">Spanish (Español)</option>
        <option value="punjabi">Punjabi (ਪੰਜਾਬੀ)</option>
      </select>
    </div>

    <div class="input-group">
      <label for="vibeSelect">Preferred Mood</label>
      <select id="vibeSelect">
        <option value="upbeat">Upbeat & Energetic</option>
        <option value="chill" selected>Chill & Lofi</option>
        <option value="romantic">Romantic & Soft</option>
      </select>
    </div>
  </div>

  <div class="drop-zone" id="dropZone">
    <div class="scanner-line" id="scannerLine"></div>
    <p id="uploadText">📁 Drag & Drop an image here or <b>Click to Browse</b></p>
    <input type="file" id="imageInput" accept="image/*">
    
    <div class="media-preview-container" id="previewContainer">
      <img id="imagePreview" alt="Upload Preview">
    </div>
  </div>

  <p class="status-badge" id="statusText">System Ready. Upload an image to start audio generation.</p>

  <!-- Custom Player Card & Lyrics -->
  <div class="player-card" id="playerCard">
    <div class="song-header">
      <div class="song-details">
        <div class="song-title" id="songTitle">Song Title</div>
        <div class="song-artist" id="songArtist">Artist Name</div>
      </div>
      <button class="btn-remix" id="remixBtn">✨ Remix Vibe</button>
    </div>

    <audio id="audioPlayer" controls></audio>

    <div class="lyrics-box" id="lyricsBox">
      Lyrics will appear here once audio loads...
    </div>
  </div>

  <!-- Real-time Suggested History Log -->
  <div class="history-card" id="historyCard">
    <h3>📜 Suggested Track History <span id="historyCount">(0)</span></h3>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<script>
  // =========================================================================
  // 1. ANTI-INSPECT PROTECTION LAYER
  // =========================================================================

  document.addEventListener('contextmenu', (e) => e.preventDefault());

  document.addEventListener('keydown', (e) => {
    if (
      e.key === 'F12' || 
      (e.ctrlKey && e.shiftKey && ['I', 'i', 'J', 'j', 'C', 'c'].includes(e.key)) ||
      (e.ctrlKey && (e.key === 'U' || e.key === 'u'))
    ) {
      e.preventDefault();
      return false;
    }
  });

  setInterval(() => {
    const startTime = performance.now();
    debugger;
    const endTime = performance.now();
    if (endTime - startTime > 100) {
      document.body.innerHTML = "<div style='color:white;text-align:center;margin-top:100px;'><h2>Access Restricted</h2></div>";
    }
  }, 1000);

  // =========================================================================
  // 2. AUDIO DATABASE & SCENE MATCHING ENGINE
  // =========================================================================

  const AUDIO_DATABASE = {
    "person": {
      hindi: [
        { title: "Zindagi Ek Safar", artist: "Kishore Kumar", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", lyrics: "Zindagi ek safar hai suhana\nYahan kal kya ho kisne jaana\nOho zindagi ek safar hai suhana..." },
        { title: "Phir Se Udd Chala", artist: "Mohit Chauhan", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3", lyrics: "Phir se udd chala\nKahi door door door...\nKabhi daal daal kabhi paat paat..." },
        { title: "Safarnama", artist: "Lucky Ali", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3", lyrics: "O Safarnama... Sawaar ne laga\nMera rastaa... tanaane tanaane..." }
      ],
      english: [
        { title: "Happy Vibe", artist: "Pharrell Williams", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3", lyrics: "It might seem crazy what I'm 'bout to say\nSunshine she's here, you can take a break..." },
        { title: "Acoustic Sunset", artist: "John Mayer", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3", lyrics: "Shadows in the open air\nBreeze through the quiet hair..." }
      ]
    },
    "person+dog": {
      hindi: [
        { title: "Tera Yaar Hoon Main", artist: "Arijit Singh", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3", lyrics: "Tu jo rootha toh kaun hansega\nTu jo chhoota toh kaun rahega\nTu hi toh hai mera dost..." },
        { title: "Yaaron Dosti", artist: "KK", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3", lyrics: "Yaaron dosti badi hi haseen hai\nYeh na ho toh kya phir bolo yeh zindagi hai..." }
      ],
      english: [
        { title: "Count On Me", artist: "Bruno Mars", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3", lyrics: "If you ever find yourself stuck in the middle of the sea\nI'll sail the world to find you..." }
      ]
    },
    "car+mountain": {
      hindi: [
        { title: "Yun Hi Chala Chal", artist: "Udit Narayan", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3", lyrics: "Yun hi chala chal rahi\nKitni haseen hai yeh duniya\nPhoolon bhari yeh raahein..." },
        { title: "Dil Chahta Hai", artist: "Shankar Mahadevan", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3", lyrics: "Dil chahta hai kabhi na beete chamkeele din..." }
      ]
    },
    "tree": {
      hindi: [
        { title: "Hawaa Hawaa", artist: "Mohit Chauhan", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-11.mp3", lyrics: "Hawaa hawaa aaye hawaa\nKhushboo luta de hawaa..." }
      ]
    },
    "mountain": {
      hindi: [
        { title: "Yeh Haseen Waadiyan", artist: "A.R. Rahman", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-12.mp3", lyrics: "Yeh haseen waadiyan yeh khula aasmaan\nAa gaye hum kahan ae mere saajna..." }
      ]
    },
    "default": {
      hindi: [
        { title: "Ilahi (Lofi Remix)", artist: "Arijit Singh", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-13.mp3", lyrics: "Shaam bhi koi jaise hai nadi\nLehron lehar jaise beh rahi...\nIlahi mera jee aaye aaye..." },
        { title: "Matargashti", artist: "Mohit Chauhan", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-14.mp3", lyrics: "Matargashti khuli sadak mein\nMukhtasar ho baatein..." }
      ],
      english: [
        { title: "Acoustic Journey", artist: "Studio Track", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3", lyrics: "Walking down the open trail\nUnderneath the gentle rain..." }
      ]
    }
  };

  let model;
  let currentDetectedSceneKey = "default";
  let currentTrackIndex = 0;
  let imageHistory = [];

  async function initAI() {
    const statusText = document.getElementById('statusText');
    statusText.innerText = "⚡ Loading visual analysis engine...";
    model = await cocoSsd.load();
    statusText.innerText = "✅ Engine Ready! Upload an image to play music.";
  }
  initAI();

  const dropZone = document.getElementById('dropZone');
  const imageInput = document.getElementById('imageInput');
  const audioPlayer = document.getElementById('audioPlayer');
  const remixBtn = document.getElementById('remixBtn');
  const languageSelect = document.getElementById('languageSelect');

  dropZone.addEventListener('click', () => imageInput.click());
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) processFile(e.dataTransfer.files[0]);
  });

  imageInput.addEventListener('change', (e) => {
    if (e.target.files.length) processFile(e.target.files[0]);
  });

  remixBtn.addEventListener('click', () => {
    currentTrackIndex++;
    loadSongForScene(currentDetectedSceneKey, true);
  });

  languageSelect.addEventListener('change', () => {
    currentTrackIndex = 0;
    loadSongForScene(currentDetectedSceneKey, false);
  });

  function processFile(file) {
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = document.getElementById('imagePreview');
      img.src = event.target.result;
      
      document.getElementById('previewContainer').style.display = 'flex';
      document.getElementById('uploadText').style.display = 'none';

      imageHistory = [];
      currentTrackIndex = 0;
      updateHistoryUI();
      
      img.onload = async () => {
        await analyzeAndPlay(img);
      };
    };
    reader.readAsDataURL(file);
  }

  async function analyzeAndPlay(img) {
    if (!model) return;
    
    const scanner = document.getElementById('scannerLine');
    const statusText = document.getElementById('statusText');

    scanner.style.display = 'block';
    statusText.innerText = "🔍 Processing visual elements & scene context...";

    const predictions = await model.detect(img);
    scanner.style.display = 'none';

    let sceneKey = "default";

    if (predictions.length > 0) {
      const detectedClasses = [...new Set(predictions.map(p => p.class.toLowerCase()))].sort();
      const combinedKey = detectedClasses.slice(0, 2).join("+");
      
      if (AUDIO_DATABASE[combinedKey]) {
        sceneKey = combinedKey;
      } else if (AUDIO_DATABASE[detectedClasses[0]]) {
        sceneKey = detectedClasses[0];
      }
    } else {
      sceneKey = analyzeLandscapeColor(img);
    }

    currentDetectedSceneKey = sceneKey;
    statusText.innerText = "🎶 Auto-selected best track matching scene context!";
    loadSongForScene(sceneKey);
  }

  function analyzeLandscapeColor(img) {
    const tempCanvas = document.createElement('canvas');
    const tempCtx = tempCanvas.getContext('2d');
    tempCanvas.width = img.naturalWidth;
    tempCanvas.height = img.naturalHeight;
    tempCtx.drawImage(img, 0, 0);

    const data = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height).data;
    let r = 0, g = 0, b = 0;
    const step = 20;

    for (let i = 0; i < data.length; i += 4 * step) {
      r += data[i]; g += data[i + 1]; b += data[i + 2];
    }

    const total = data.length / (4 * step);
    r = r / total; g = g / total; b = b / total;

    if (g > r && g > b) return "tree";
    if (b > r && b > g) return "mountain";
    return "default";
  }

  function loadSongForScene(sceneKey, isRemix = false) {
    const lang = document.getElementById('languageSelect').value;
    const playlist = (AUDIO_DATABASE[sceneKey] && AUDIO_DATABASE[sceneKey][lang]) 
      ? AUDIO_DATABASE[sceneKey][lang] 
      : (AUDIO_DATABASE.default[lang] || AUDIO_DATABASE.default.english);

    const songIndex = currentTrackIndex % playlist.length;
    const selectedSong = playlist[songIndex];

    document.getElementById('songTitle').innerText = selectedSong.title;
    document.getElementById('songArtist').innerText = selectedSong.artist;
    document.getElementById('lyricsBox').innerText = selectedSong.lyrics;
    
    audioPlayer.src = selectedSong.src;
    document.getElementById('playerCard').style.display = 'flex';
    audioPlayer.play();

    const historyItem = { title: selectedSong.title, artist: selectedSong.artist, lang: lang.toUpperCase() };
    if (!imageHistory.length || imageHistory[imageHistory.length - 1].title !== selectedSong.title) {
      imageHistory.push(historyItem);
      updateHistoryUI();
    }
  }

  function updateHistoryUI() {
    const historyCard = document.getElementById('historyCard');
    const historyList = document.getElementById('historyList');
    const historyCount = document.getElementById('historyCount');

    if (imageHistory.length === 0) {
      historyCard.style.display = 'none';
      return;
    }

    historyCard.style.display = 'block';
    historyCount.innerText = `(${imageHistory.length})`;
    historyList.innerHTML = '';

    imageHistory.slice().reverse().forEach((item, index) => {
      const realSequenceIndex = imageHistory.length - index;
      const isCurrent = index === 0;

      const div = document.createElement('div');
      div.className = `history-item ${isCurrent ? 'active' : ''}`;
      div.innerHTML = `
        <div class="history-info">
          <span class="history-index">#${realSequenceIndex}</span>
          <div class="history-info-text">
            <strong>${item.title}</strong> — <span style="color:#94a3b8">${item.artist}</span>
          </div>
        </div>
        <span class="badge-lang">${item.lang}</span>
      `;
      historyList.appendChild(div);
    });
  }
</script>

</body>
</html>

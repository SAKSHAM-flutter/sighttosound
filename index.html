<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SightToSound - Full Multi-Object Internet Archive Matcher</title>
  
  <!-- TensorFlow.js & COCO-SSD Object Detection Models -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

  <style>
    :root {
      --bg: #070a12;
      --card-bg: rgba(15, 23, 42, 0.85);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.45);
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #0f172a;
      --radius-lg: 20px;
      --radius-md: 12px;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15), transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.12), transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(12px, 3vw, 24px);
    }

    .app-container {
      width: 100%;
      max-width: 850px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: clamp(16px, 4vw, 32px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    header { text-align: center; margin-bottom: clamp(16px, 3vw, 24px); }
    header h1 { 
      font-size: clamp(1.8rem, 5vw, 2.6rem); 
      font-weight: 800;
      letter-spacing: -0.8px;
      background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #38bdf8 100%); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
    }
    header p { color: var(--text-muted); font-size: clamp(0.85rem, 2vw, 0.95rem); margin-top: 4px; }

    .control-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .input-group { display: flex; flex-direction: column; gap: 6px; }
    .input-group label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #cbd5e1; }
    
    select {
      background: var(--input-bg);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px;
      border-radius: var(--radius-md);
      outline: none;
      font-size: 0.95rem;
      min-height: 44px;
      width: 100%;
    }
    select:focus { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }

    .drop-zone {
      border: 2px dashed rgba(255, 255, 255, 0.18);
      border-radius: var(--radius-lg);
      padding: clamp(20px, 4vw, 30px);
      text-align: center;
      cursor: pointer;
      position: relative;
      background: rgba(15, 23, 42, 0.4);
      transition: all 0.3s ease;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .drop-zone:hover { border-color: var(--accent); background: rgba(99, 102, 241, 0.08); }
    .drop-zone input[type="file"] { display: none; }

    .media-preview-container {
      position: relative;
      width: 100%;
      margin-top: 10px;
      display: none;
      justify-content: center;
    }
    .media-preview-container img {
      max-width: 100%;
      max-height: clamp(200px, 35vh, 280px);
      object-fit: contain;
      border-radius: var(--radius-md);
    }

    .meta-tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 12px;
    }
    .tag-chip {
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #a5b4fc;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .tag-chip.object-chip {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.4);
      color: #38bdf8;
    }

    .status-badge {
      text-align: center;
      font-size: 0.88rem;
      color: var(--text-muted);
      margin: 14px 0;
      min-height: 1.4em;
    }

    .player-card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-top: 14px;
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .song-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .song-details { flex: 1; min-width: 180px; }
    .song-title { font-size: 1.2rem; font-weight: 700; color: #38bdf8; }
    .song-artist { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }

    .btn-remix {
      background: var(--accent-gradient);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: 700;
      cursor: pointer;
      min-height: 42px;
      transition: transform 0.2s ease;
    }
    .btn-remix:hover { transform: scale(1.03); }

    audio { width: 100%; height: 42px; outline: none; margin-top: 6px; }

    .history-card {
      background: rgba(7, 10, 18, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-top: 14px;
      display: none;
    }
    .history-card h3 { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; }
    .history-list { display: flex; flex-direction: column; gap: 8px; max-height: 160px; overflow-y: auto; }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--input-bg);
      padding: 8px 12px;
      border-radius: var(--radius-md);
      font-size: 0.82rem;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>SightToSound</h1>
    <p>Multi-Object Visual & Filter Music Matcher</p>
  </header>

  <div class="control-panel">
    <div class="input-group">
      <label for="languageSelect">Music Language</label>
      <select id="languageSelect">
        <option value="hindi" selected>Hindi (हिंदी)</option>
        <option value="english">English</option>
        <option value="bengali">Bengali (বাংলা)</option>
        <option value="spanish">Spanish (Español)</option>
        <option value="punjabi">Punjabi (ਪੰਜਾਬੀ)</option>
      </select>
    </div>

    <div class="input-group">
      <label for="vibeSelect">Preferred Mood</label>
      <select id="vibeSelect">
        <option value="upbeat">Upbeat & Energetic</option>
        <option value="chill" selected>Chill & Lofi</option>
        <option value="romantic">Romantic & Soft</option>
        <option value="melancholic">Melancholic & Dark</option>
      </select>
    </div>
  </div>

  <div class="drop-zone" id="dropZone">
    <p id="uploadText">📁 Drag & Drop an image here or <b>Click to Browse</b></p>
    <input type="file" id="imageInput" accept="image/*">
    
    <div class="media-preview-container" id="previewContainer">
      <img id="imagePreview" alt="Upload Preview">
    </div>
  </div>

  <div class="meta-tags-row" id="tagContainer"></div>

  <p class="status-badge" id="statusText">System Ready. Upload an image to start music matching.</p>

  <div class="player-card" id="playerCard">
    <div class="song-header">
      <div class="song-details">
        <div class="song-title" id="songTitle">Searching Archive...</div>
        <div class="song-artist" id="songArtist">Internet Archive</div>
      </div>
      <button class="btn-remix" id="remixBtn">✨ Remix Vibe</button>
    </div>

    <audio id="audioPlayer" controls autoplay></audio>
  </div>

  <div class="history-card" id="historyCard">
    <h3>📜 Session History <span id="historyCount">(0)</span></h3>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<script>
  let model;

  const activeSession = {
    imageHash: null,
    detectedObjects: [], // STORES ALL DETECTED OBJECTS
    lightingMood: '',
    colorPaletteTag: '',
    playedUrls: new Set(),
    historyLog: []
  };

  async function initAI() {
    const statusText = document.getElementById('statusText');
    statusText.innerText = "⚡ Loading object detection vision model...";
    model = await cocoSsd.load();
    statusText.innerText = "✅ Engine Ready! Upload an image to detect all objects & filters.";
  }
  initAI();

  const dropZone = document.getElementById('dropZone');
  const imageInput = document.getElementById('imageInput');
  const remixBtn = document.getElementById('remixBtn');
  const languageSelect = document.getElementById('languageSelect');
  const vibeSelect = document.getElementById('vibeSelect');

  dropZone.addEventListener('click', () => imageInput.click());
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); });
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    if (e.dataTransfer.files.length) processFile(e.dataTransfer.files[0]);
  });

  imageInput.addEventListener('change', (e) => {
    if (e.target.files.length) processFile(e.target.files[0]);
  });

  remixBtn.addEventListener('click', () => searchAndPlayArchiveTrack());
  languageSelect.addEventListener('change', () => searchAndPlayArchiveTrack());
  vibeSelect.addEventListener('change', () => searchAndPlayArchiveTrack());

  function processFile(file) {
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = document.getElementById('imagePreview');
      img.src = event.target.result;
      
      document.getElementById('previewContainer').style.display = 'flex';
      document.getElementById('uploadText').style.display = 'none';

      img.onload = async () => {
        const newHash = generateImageFingerprint(img);

        if (activeSession.imageHash !== newHash) {
          activeSession.imageHash = newHash;
          activeSession.playedUrls.clear();
          activeSession.historyLog = [];
          updateHistoryUI();
        }

        await analyzeImageContext(img);
      };
    };
    reader.readAsDataURL(file);
  }

  function generateImageFingerprint(img) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 32; canvas.height = 32;
    ctx.drawImage(img, 0, 0, 32, 32);
    const data = ctx.getImageData(0, 0, 32, 32).data;
    let hash = 0;
    for (let i = 0; i < data.length; i += 4) {
      hash = ((hash << 5) - hash) + data[i] + data[i+1] + data[i+2];
      hash |= 0;
    }
    return 'img_' + Math.abs(hash);
  }

  async function analyzeImageContext(img) {
    const statusText = document.getElementById('statusText');
    statusText.innerText = "🔍 Scanning image for ALL objects, light levels, & color tones...";

    // 1. Detect ALL Objects in Image (Filtered for Uniques)
    const predictions = await model.detect(img);
    const detectedList = predictions.map(p => p.class.toLowerCase().trim());
    
    // Remove duplicates while keeping full list of detected items
    activeSession.detectedObjects = [...new Set(detectedList)];
    
    if (activeSession.detectedObjects.length === 0) {
      activeSession.detectedObjects = ["landscape", "background"];
    }

    // 2. Perform Pixel Luminance & Color Temperature Analysis
    analyzeColorFilters(img);

    // 3. Render Tag Chips for all detected visual metadata
    renderTagsUI();

    statusText.innerText = `🎵 Detected ${activeSession.detectedObjects.length} object(s)! Querying Internet Archive...`;
    searchAndPlayArchiveTrack();
  }

  function analyzeColorFilters(img) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 100;
    canvas.height = 100;
    ctx.drawImage(img, 0, 0, 100, 100);

    const data = ctx.getImageData(0, 0, 100, 100).data;
    let totalLuminance = 0;
    let totalR = 0, totalG = 0, totalB = 0;
    const pixelCount = data.length / 4;

    for (let i = 0; i < data.length; i += 4) {
      const r = data[i];
      const g = data[i + 1];
      const b = data[i + 2];

      totalR += r; totalG += g; totalB += b;

      // Standard Relative Luminance Formula
      const lum = (0.2126 * r) + (0.7152 * g) + (0.0722 * b);
      totalLuminance += lum;
    }

    const avgLum = totalLuminance / pixelCount;
    const avgR = totalR / pixelCount;
    const avgG = totalG / pixelCount;
    const avgB = totalB / pixelCount;

    // Classify Dark vs Light Filter
    if (avgLum < 85) {
      activeSession.lightingMood = "dark moody night ambient";
    } else if (avgLum > 170) {
      activeSession.lightingMood = "bright sunny day bright";
    } else {
      activeSession.lightingMood = "balanced atmospheric";
    }

    // Classify Dominant Color Temperature / Filter
    if (avgR > avgB + 20 && avgR > avgG) {
      activeSession.colorPaletteTag = "warm red golden acoustic";
    } else if (avgB > avgR + 15) {
      activeSession.colorPaletteTag = "cool blue calm chill";
    } else if (avgG > avgR && avgG > avgB) {
      activeSession.colorPaletteTag = "green nature organic relax";
    } else {
      activeSession.colorPaletteTag = "lofi soft melody";
    }
  }

  function renderTagsUI() {
    const tagContainer = document.getElementById('tagContainer');
    tagContainer.innerHTML = '';

    // Render chips for ALL detected objects
    activeSession.detectedObjects.forEach(obj => {
      const chip = document.createElement('span');
      chip.className = 'tag-chip object-chip';
      chip.innerText = `#${obj}`;
      tagContainer.appendChild(chip);
    });

    // Render lighting & color filter chips
    const filterTags = [
      activeSession.lightingMood.split(' ')[0] + " filter",
      activeSession.colorPaletteTag.split(' ')[0] + " tone"
    ];

    filterTags.forEach(f => {
      const chip = document.createElement('span');
      chip.className = 'tag-chip';
      chip.innerText = `#${f}`;
      tagContainer.appendChild(chip);
    });
  }

  async function searchAndPlayArchiveTrack() {
    const statusText = document.getElementById('statusText');
    const lang = languageSelect.value;
    const vibe = vibeSelect.value;
    
    // COMBINE ALL OBJECTS INTO THE QUERY STRING
    const allObjectsString = activeSession.detectedObjects.join(" ");
    const lightFilter = activeSession.lightingMood.split(' ')[0];
    const colorFilter = activeSession.colorPaletteTag.split(' ')[0];

    // Primary precise query: Language + Mood + ALL Objects + Dark/Light Filter + Color Filter
    const fullQuery = `${lang} ${vibe} ${allObjectsString} ${lightFilter} ${colorFilter}`;
    
    statusText.innerText = `🔍 Full Match Query: "${fullQuery}"...`;

    try {
      // Step 1: Strict Multi-Constraint Query
      let searchUrl = `https://archive.org/advancedsearch.php?q=mediatype:audio+AND+(${encodeURIComponent(fullQuery)})&fl[]=identifier,title,creator,downloads&sort[]=downloads+desc&output=json&rows=20`;
      let res = await fetch(searchUrl);
      let searchData = await res.json();
      let docs = searchData.response.docs;

      // Step 2: Fallback 1 (All Objects + Language + Mood)
      if (!docs || docs.length === 0) {
        const fallback1Query = `${lang} ${vibe} ${allObjectsString}`;
        searchUrl = `https://archive.org/advancedsearch.php?q=mediatype:audio+AND+(${encodeURIComponent(fallback1Query)})&fl[]=identifier,title,creator,downloads&sort[]=downloads+desc&output=json&rows=20`;
        res = await fetch(searchUrl);
        searchData = await res.json();
        docs = searchData.response.docs;
      }

      // Step 3: Fallback 2 (Language + Mood + Light Filter)
      if (!docs || docs.length === 0) {
        const fallback2Query = `${lang} ${vibe} ${lightFilter}`;
        searchUrl = `https://archive.org/advancedsearch.php?q=mediatype:audio+AND+(${encodeURIComponent(fallback2Query)})&fl[]=identifier,title,creator,downloads&sort[]=downloads+desc&output=json&rows=20`;
        res = await fetch(searchUrl);
        searchData = await res.json();
        docs = searchData.response.docs;
      }

      if (!docs || docs.length === 0) {
        statusText.innerText = "⚠️ No matching track found on Internet Archive for this combination. Try changing mood/language.";
        return;
      }

      // Step 4: Extract valid MP3 stream from query results
      for (const item of docs) {
        const metaRes = await fetch(`https://archive.org/metadata/${item.identifier}`);
        const metaData = await metaRes.json();

        // Find standard MP3 file that hasn't been played in current session
        const mp3File = (metaData.files || []).find(f => f.name.endsWith('.mp3') && !activeSession.playedUrls.has(`https://archive.org/download/${item.identifier}/${f.name}`));

        if (mp3File) {
          const directAudioUrl = `https://archive.org/download/${item.identifier}/${mp3File.name}`;
          const title = item.title || mp3File.title || mp3File.name.replace('.mp3', '');
          const artist = item.creator || "Archive Recording";

          activeSession.playedUrls.add(directAudioUrl);

          // Stream pure audio directly into standard HTML5 <audio> tag
          const audioPlayer = document.getElementById('audioPlayer');
          audioPlayer.src = directAudioUrl;
          
          document.getElementById('songTitle').innerText = title;
          document.getElementById('songArtist').innerText = artist;
          document.getElementById('playerCard').style.display = 'flex';

          audioPlayer.play();
          statusText.innerText = `▶️ Playing Best Match: ${title}`;

          logHistory(title, artist, directAudioUrl);
          return;
        }
      }

      statusText.innerText = "🔄 Exhausted current tracks pool. Click Remix Vibe to scan fresh matches.";
      activeSession.playedUrls.clear();

    } catch (err) {
      console.error(err);
      statusText.innerText = "❌ Network connection error fetching from Internet Archive.";
    }
  }

  function logHistory(title, artist, audioUrl) {
    activeSession.historyLog.push({ title, artist, audioUrl });
    updateHistoryUI();
  }

  function updateHistoryUI() {
    const historyCard = document.getElementById('historyCard');
    const historyList = document.getElementById('historyList');
    const historyCount = document.getElementById('historyCount');

    if (activeSession.historyLog.length === 0) {
      historyCard.style.display = 'none';
      return;
    }

    historyCard.style.display = 'block';
    historyCount.innerText = `(${activeSession.historyLog.length})`;
    historyList.innerHTML = '';

    activeSession.historyLog.slice().reverse().forEach((item, idx) => {
      const realIdx = activeSession.historyLog.length - idx;
      const div = document.createElement('div');
      div.className = 'history-item';
      div.innerHTML = `
        <div>
          <strong>#${realIdx} ${item.title}</strong> — <span style="color:#94a3b8">${item.artist}</span>
        </div>
        <a href="${item.audioUrl}" target="_blank" style="color:#38bdf8; text-decoration:none;">Direct Link ↗</a>
      `;
      historyList.appendChild(div);
    });
  }
</script>

</body>
</html>
